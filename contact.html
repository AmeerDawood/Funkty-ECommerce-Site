<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Funkty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-white shadow-md sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <a
          href="home.html"
          class="text-2xl font-bold text-gray-800 hover:text-gray-600"
          >Funkty</a
        >
        <nav class="space-x-4 text-sm">
          <a href="home.html" class="hover:text-gray-600">Home</a>
          <a
            href="contact.html"
            class="hover:text-gray-600 font-semibold text-gray-700"
            >Contact</a
          >
        </nav>
      </div>
    </header>

    <section id="contact" class="py-16 px-4">
      <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8 md:p-12">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">
          Get in Touch
        </h2>
        <p class="text-center text-gray-600 mb-10">
          We’d love to hear from you. Fill out the form and we’ll get back to
          you as soon as possible.
        </p>

        <form class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="name" class="block text-sm font-medium">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                required
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:ring-gray-500 focus:border-gray-500"
              />
            </div>
            <div>
              <label for="email" class="block text-sm font-medium">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:ring-gray-500 focus:border-gray-500"
              />
            </div>
          </div>
          <div>
            <label for="subject" class="block text-sm font-medium"
              >Subject</label
            >
            <input
              type="text"
              id="subject"
              name="subject"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:ring-gray-500 focus:border-gray-500"
            />
          </div>
          <div>
            <label for="message" class="block text-sm font-medium"
              >Message</label
            >
            <textarea
              id="message"
              name="message"
              rows="5"
              required
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:ring-gray-500 focus:border-gray-500"
            ></textarea>
          </div>
          <div class="text-center">
            <button
              type="submit"
              class="bg-gray-600 text-white font-semibold px-8 py-3 rounded-md hover:bg-gray-700 transition-all duration-200"
            >
              Send Message
            </button>
          </div>
        </form>
      </div>
    </section>

    <footer class="bg-white mt-20 border-t text-center text-sm py-4">
      &copy; 2025 Funkty. All rights reserved.
    </footer>
  </body>
</html>

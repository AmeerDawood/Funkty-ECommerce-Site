<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Funkty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-box">
      <a href="home.html" class="logo">Funkty<span>.</span></a>
      <h1>Create account</h1>
      <p class="sub">Sign up to start shopping.</p>

      <div class="alert" id="alert"></div>

      <form id="signupForm">
        <div class="field">
          <label for="name">Full name</label>
          <input class="input" type="text" id="name" placeholder="Enter your full name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" minlength="6" placeholder="Create a password (min 6 characters)" required />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input class="input" type="password" id="confirm" placeholder="Re-enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html" class="text-link">Log in</a>
      </p>
    </div>

    <script>
      // Demo only — accounts are saved in this browser's localStorage.
      function showAlert(type, message) {
        const alert = document.getElementById("alert");
        alert.className = `alert show ${type}`;
        alert.textContent = message;
      }

      document.getElementById("signupForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (password !== confirm) {
          showAlert("error", "Passwords do not match.");
          return;
        }

        let users = [];
        try {
          users = JSON.parse(localStorage.getItem("funkty_users")) || [];
        } catch (err) {}

        if (users.some((u) => u.email === email)) {
          showAlert("error", "An account with this email already exists.");
          return;
        }

        users.push({ name, email, password });
        try {
          localStorage.setItem("funkty_users", JSON.stringify(users));
          localStorage.setItem("funkty_session", JSON.stringify({ name, email }));
        } catch (err) {}

        showAlert("success", "Account created! Redirecting…");
        setTimeout(() => (window.location.href = "home.html"), 1000);
      });
    </script>
  </body>
</html>

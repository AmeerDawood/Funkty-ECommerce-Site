<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — Funkty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-box">
      <a href="home.html" class="logo">Funkty<span>.</span></a>
      <h1>Welcome back</h1>
      <p class="sub">Log in to your account.</p>

      <div class="alert" id="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="signup.html" class="text-link">Sign up</a>
      </p>
    </div>

    <script>
      // Demo only — checks accounts saved by signup.html, plus the demo admin.
      const DEMO_ADMIN = { name: "Admin", email: "admin@funkty.com", password: "1234" };

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;

        let users = [];
        try {
          users = JSON.parse(localStorage.getItem("funkty_users")) || [];
        } catch (err) {}

        const user = [DEMO_ADMIN, ...users].find(
          (u) => u.email === email && u.password === password
        );
        const alert = document.getElementById("alert");

        if (!user) {
          alert.className = "alert show error";
          alert.textContent = "Invalid email or password.";
          return;
        }

        try {
          localStorage.setItem(
            "funkty_session",
            JSON.stringify({ name: user.name, email: user.email })
          );
        } catch (err) {}

        alert.className = "alert show success";
        alert.textContent = `Welcome back, ${user.name}! Redirecting…`;
        setTimeout(() => (window.location.href = "home.html"), 1000);
      });
    </script>
  </body>
</html>
